<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>EjDawid overlay – podgląd</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bree+Serif&subset=latin-ext&display=swap">
  <link rel="stylesheet" href="overlay.css">
  <style>
    /* Style tylko podglądu, nie trafiają do SE */
    :root { --preview-bg: #555; --panel-bg: #222; --panel-fg: #eee; --guide: #ffffff88; }
    body { margin: 0; background: var(--panel-bg); color: var(--panel-fg); font-family: sans-serif; }
    .panel { padding: 6px 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .panel button, .panel input { font-size: 14px; padding: 5px 9px; }
    .panel input { width: 70px; }
    /* Płótno 1920×1080 pomniejszone o połowę */
    .stage-wrap { width: 960px; height: 540px; margin: 6px 10px; outline: 1px dashed var(--panel-fg); }
    .stage { position: relative; width: 1920px; height: 1080px; transform: scale(0.5); transform-origin: 0 0; background: var(--preview-bg); }
    /* Miejsca elementów spoza kodu: G1 kamerka (OBS), G4 Tipply, pasek przedmiotów */
    .guide { position: absolute; border: 3px dashed var(--guide); color: var(--guide); font-size: 26px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="panel">
    <strong>Tryb:</strong>
    <button data-mode="gra">gra</button>
    <button data-mode="start">start</button>
    <button data-mode="przerwa">przerwa</button>
    <button data-mode="koniec">koniec</button>
  </div>
  <div class="panel">
    <strong>Sesja:</strong>
    cel <input id="goal" type="number" value="50">
    followy <input id="count" type="number" value="32">
    <button id="load">Wczytaj (onWidgetLoad)</button>
    <button id="empty">Pusty start (brak followa)</button>
    <button id="follow">Nowy follow</button>
    <button id="longnick">Follow z długim nickiem</button>
  </div>
  <div class="panel">
    <strong>Alerty:</strong>
    <button data-ev="sub">Sub</button>
    <button data-ev="resub">Resub + wiadomość</button>
    <button data-ev="gift">Gift pojedynczy</button>
    <button data-ev="bulk">Paczka 5 giftów</button>
    <button data-ev="bitsSmall">50 bitsów</button>
    <button data-ev="bitsBig">500 bitsów</button>
    <button data-ev="raid">Raid</button>
    <button data-ev="burst">3 naraz</button>
  </div>
  <div class="panel">
    <strong>Przyciski SE (W2):</strong>
    <button data-test="testFollow">testFollow</button>
    <button data-test="testSub">testSub</button>
    <button data-test="testGift">testGift</button>
    <button data-test="testBits">testBits</button>
    <button data-test="testRaid">testRaid</button>
    <button data-test="testChat">testChat</button>
  </div>
  <div class="panel">
    <strong>Czat (E3):</strong>
    <button id="chat1">Wiadomość</button>
    <button id="chatEmote">Z emotkami</button>
    <button id="chatLong">Długa</button>
    <button id="chat40">40 wiadomości</button>
    <button id="chatDelLast">Usuń ostatnią (mod)</button>
    <button id="chatDelUser">Usuń wszystkie od ola (mod)</button>
    <button id="chatEvil">Próba HTML w treści</button>
  </div>
  <div class="stage-wrap">
    <div class="stage">
      <div class="guide" style="left:40px;top:330px;width:360px;height:200px">G1 kamerka (OBS)</div>
      <div class="guide" style="left:40px;top:690px;width:360px;height:60px">G4 Tipply</div>
      <div class="guide" style="left:0;top:960px;width:1920px;height:120px">pasek przedmiotów gry (nic tu)</div>
      <div id="ej-root"></div>
    </div>
  </div>

  <script>
    // Ten sam bufor i nasłuch co w se/loader.html
    window.EjOverlayQueue = [];
    ['onWidgetLoad', 'onEventReceived', 'onSessionUpdate'].forEach(function (type) {
      window.addEventListener(type, function (obj) {
        if (window.EjOverlay) window.EjOverlay.handle(type, obj.detail);
        else if (window.EjOverlayQueue) window.EjOverlayQueue.push([type, obj.detail]);
      });
    });

    // Symulacja SE
    var sim = { mode: 'gra', latest: 'kasia_m' };
    var nicks = ['zielony_lis', 'bartek99', 'ola', 'Żółw_Łódź', 'kasia_m'];
    function emit(type, detail) { window.dispatchEvent(new CustomEvent(type, { detail: detail })); }
    function count() { return Number(document.getElementById('count').value); }
    function session() {
      return { 'follower-total': { count: count() }, 'follower-latest': { name: sim.latest } };
    }
    function widgetLoad() {
      emit('onWidgetLoad', {
        fieldData: {
          mode: sim.mode, followGoal: Number(document.getElementById('goal').value),
          badgeSeconds: 4, cardSeconds: 7, bitsThreshold: 100, soundFollow: '', soundCard: ''
        },
        session: { data: session() }
      });
    }
    function follow(name) {
      sim.latest = name;
      document.getElementById('count').value = count() + 1;
      emit('onEventReceived', { listener: 'follower-latest', event: { name: name, amount: 0 } });
      emit('onSessionUpdate', { session: session() });
    }

    document.querySelectorAll('[data-mode]').forEach(function (btn) {
      btn.addEventListener('click', function () { sim.mode = btn.dataset.mode; widgetLoad(); });
    });
    document.getElementById('load').onclick = widgetLoad;
    document.getElementById('empty').onclick = function () {
      sim.latest = '';
      document.getElementById('count').value = 0;
      widgetLoad();
    };
    document.getElementById('follow').onclick = function () {
      follow(nicks[Math.floor(Math.random() * nicks.length)]);
    };
    document.getElementById('longnick').onclick = function () { follow('BardzoDlugiNickWidza_12345'); };

    // Zdarzenia alertów w kształcie jak z SE (spec 6)
    function ev(listener, event) { emit('onEventReceived', { listener: listener, event: event }); }
    var events = {
      sub: function () { ev('subscriber-latest', { name: 'kasia_m', amount: 1, tier: '1000', message: '' }); },
      resub: function () { ev('subscriber-latest', { name: 'bartek99', amount: 5, tier: '1000', message: 'Pięć miesięcy z chatą w lesie, pozdro Dawid! Długa wiadomość, żeby sprawdzić zawijanie i obcinanie tekstu na karcie.' }); },
      gift: function () { ev('subscriber-latest', { name: 'ola', sender: 'zielony_lis', amount: 1, gifted: true }); },
      bulk: function () {
        ev('subscriber-latest', { name: 'zielony_lis', sender: 'zielony_lis', amount: 5, bulkGifted: true });
        // pojedyncze suby z paczki: mają zostać pominięte
        for (var i = 0; i < 5; i++) ev('subscriber-latest', { name: 'widz' + i, sender: 'zielony_lis', amount: 1, gifted: true, isCommunityGift: true });
      },
      bitsSmall: function () { ev('cheer-latest', { name: 'ola', amount: 50, message: 'Cheer50 hej' }); },
      bitsBig: function () { ev('cheer-latest', { name: 'Żółw_Łódź', amount: 500, message: 'Cheer500 za budowę!' }); },
      raid: function () { ev('raid-latest', { name: 'sasiad_streamer', amount: 12 }); },
      burst: function () { events.sub(); follow('ola'); events.raid(); }
    };
    document.querySelectorAll('[data-ev]').forEach(function (btn) {
      btn.addEventListener('click', function () { events[btn.dataset.ev](); });
    });
    // Czat: zdarzenia jak z SE (listener 'message', dane w event.data)
    var chatN = 0, lastMsgId = '';
    var kappa = { name: 'Kappa', urls: { 1: '', 2: 'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0', 4: '' } };
    function chat(name, text, emotes) {
      chatN++;
      lastMsgId = 'm' + chatN;
      ev('message', { data: { displayName: name, nick: name.toLowerCase(), text: text, emotes: emotes || [], msgId: lastMsgId, userId: 'u_' + name } });
    }
    var lines = ['hejka!', 'co dziś budujemy?', 'czekam na start', '<3', 'Dawid, pokaż chatę!'];
    document.getElementById('chat1').onclick = function () { chat(nicks[chatN % nicks.length], lines[chatN % lines.length]); };
    document.getElementById('chatEmote').onclick = function () { chat('ola', 'Kappa to jest test Kappa', [kappa]); };
    document.getElementById('chatLong').onclick = function () { chat('BardzoDlugiNickWidza_12345', 'Bardzo długa wiadomość bez sensu, żeby sprawdzić zawijanie w panelu czatu: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa koniec.'); };
    document.getElementById('chat40').onclick = function () { for (var i = 0; i < 40; i++) chat(nicks[i % nicks.length], 'wiadomość nr ' + (chatN + 1)); };
    document.getElementById('chatDelLast').onclick = function () { ev('delete-message', { msgId: lastMsgId }); };
    document.getElementById('chatDelUser').onclick = function () { ev('delete-messages', { userId: 'u_ola' }); };
    document.getElementById('chatEvil').onclick = function () { chat('<b>haker</b>', '<img src=x onerror=alert(1)> <script>alert(2)<\/script>'); };

    document.querySelectorAll('[data-test]').forEach(function (btn) {
      btn.addEventListener('click', function () { ev('widget-button', { field: btn.dataset.test, value: '' }); });
    });
    widgetLoad();
  </script>
  <script src="overlay.js?debug=1"></script>
</body>
</html>
